<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Narada — Attention</title>
    <meta
      name="description"
      content="Narada attention home: dues, blocked Firefly pushes, service health, last SMS import."
    />
    <link rel="stylesheet" href="/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a222c'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23e8b86d' stroke-width='2.5'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <p class="eyebrow">नारद</p>
        <h1>Attention</h1>
        <p class="lede">
          What needs a look. Ledger, charts, and budgets stay in Dhan.
        </p>
        <nav class="site-nav" aria-label="Narada">
          <a href="/" aria-current="page">Attention</a>
          <a href="/merchants.html">Merchants</a>
        </nav>
      </div>
      <div class="top-meta">
        <p id="attention-summary" class="summary" aria-live="polite">Loading…</p>
        <p id="clock" class="muted"></p>
        <p class="top-actions">
          <button type="button" id="refresh" class="btn">Refresh</button>
          <button type="button" id="send-digest" class="btn mark-due">
            Send digest
          </button>
        </p>
      </div>
    </header>

    <main>
      <section class="panel strip" aria-labelledby="import-heading">
        <div class="strip-row">
          <div>
            <h2 id="import-heading">Last SMS import</h2>
            <p id="import-status" class="muted">Checking…</p>
          </div>
          <p id="live-status" class="live" data-state="unknown">API</p>
        </div>
      </section>

      <section class="panel" aria-labelledby="services-heading">
        <details class="panel-fold" data-fold="services" open>
          <summary class="section-head">
            <span class="fold-mark" aria-hidden="true"></span>
            <h2 id="services-heading">Services</h2>
            <p id="services-meta" class="muted"></p>
          </summary>
          <div id="services" class="chips" role="list"></div>
        </details>
      </section>

      <section class="panel" aria-labelledby="tools-heading">
        <div class="section-head">
          <h2 id="tools-heading">Find</h2>
          <button type="button" id="reset-view" class="btn">Reset</button>
        </div>
        <form id="toolbar" class="toolbar" action="/" method="get">
          <label class="grow">
            <span class="sr-only">Search</span>
            <input
              id="query"
              name="q"
              type="search"
              placeholder="Search last4, bank, merchant, SMS…"
              autocomplete="off"
            />
          </label>
          <label>
            <span class="field-label">Since</span>
            <select id="since" name="since">
              <option value="3">Past 3 months</option>
              <option value="6" selected>Past 6 months</option>
              <option value="12">Past 12 months</option>
              <option value="all">All time</option>
            </select>
          </label>
          <label>
            <span class="field-label">Dues</span>
            <select id="due-status" name="status">
              <option value="">Unpaid</option>
              <option value="overdue">Overdue</option>
              <option value="open">Upcoming</option>
              <option value="paid">Paid</option>
              <option value="all">All</option>
            </select>
          </label>
          <label>
            <span class="field-label">Sort</span>
            <select id="sort" name="sort">
              <option value="">Attention</option>
              <option value="dueDate">Due date</option>
              <option value="amount">Amount</option>
              <option value="bank">Bank</option>
              <option value="occurredAt">Newest SMS</option>
            </select>
          </label>
          <label>
            <span class="field-label">Order</span>
            <select id="order" name="order">
              <option value="asc">Ascending</option>
              <option value="desc">Descending</option>
            </select>
          </label>
        </form>
      </section>

      <div class="columns">
        <section class="panel" aria-labelledby="dues-heading">
          <details class="panel-fold" data-fold="dues" open>
            <summary class="section-head">
              <span class="fold-mark" aria-hidden="true"></span>
              <h2 id="dues-heading">Dues</h2>
              <p id="dues-meta" class="muted"></p>
            </summary>
            <div id="dues" class="cards"></div>
          </details>
        </section>

        <section class="panel" aria-labelledby="blocked-heading">
          <div class="section-head">
            <h2 id="blocked-heading">Blocked pushes</h2>
            <p id="blocked-meta" class="muted"></p>
          </div>
          <div id="blocked" class="cards"></div>
        </section>
      </div>
    </main>

    <noscript>
      <p class="noscript">
        Enable JavaScript to load dues, blocked pushes, and service status from
        this Narada instance.
      </p>
    </noscript>
    <script src="/app.js" defer></script>
  </body>
</html>
