name: Deploy Narada

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy
        run: |
          echo "Deploying Narada from /opt/stacks/narada"
          echo "Commit: ${GITHUB_SHA}"
          cd /opt/stacks/narada
          git pull
          docker compose up -d --build
          docker compose ps
